name: Bug report
description: Report a reproducible problem with the bridge or mapping.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: describe
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include Mixxx, Python, and mixxx-api-bridge versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and reproduction
      description: Paste a minimal command/API request and relevant logs.
      render: text
