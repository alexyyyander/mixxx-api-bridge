name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Validate mapping JavaScript
        run: node --check src/mixxx_api_bridge/mapping/MixxxApiBridge-scripts.js
      - name: Validate mapping XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('src/mixxx_api_bridge/mapping/MixxxApiBridge.midi.xml')"

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source archive
        run: python -m build
      - name: Check package contents
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.endswith("MixxxApiBridge.midi.xml") for name in names)
              assert any(name.endswith("MixxxApiBridge-scripts.js") for name in names)

          source = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(source, "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/docs/API.md") for name in names)
              assert any(name.endswith("/LICENSE") for name in names)
          PY
